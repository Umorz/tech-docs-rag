# Правила gitleaks для этого репозитория: все стандартные (ключи API, токены)
# плюс свои - то, что стандартные не ловят, но в публичный репозиторий попадать не должно.
# Регулярные выражения общие, без конкретных значений: иначе этот файл сам стал бы утечкой.

[extend]
useDefault = true

[[rules]]
id = "personal-gmail"
description = "Личная почта gmail (в коммитах используется noreply-адрес GitHub)"
regex = '''[A-Za-z0-9._%+-]+@gmail\.com'''

[[rules]]
id = "private-ip"
description = "Внутренний IP-адрес (10.x, 172.16-31.x, 192.168.x); адреса серверов хранятся в .env"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''
# uv.lock генерирует uv: там версии пакетов вида 10.4.0.35, похожие на адреса
[[rules.allowlists]]
paths = ['''(^|/)uv\.lock$''']

[[rules]]
id = "windows-user-path"
description = "Путь к папке пользователя Windows с его именем; вместо него %USERPROFILE%"
regex = '''[A-Za-z]:[\\/]+Users[\\/]+[A-Za-z0-9._-]+'''
