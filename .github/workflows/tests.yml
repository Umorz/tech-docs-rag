name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - name: Окружение строго по uv.lock
        run: uv sync --locked
      - name: Тесты
        run: uv run pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # gitleaks напрямую, а не gitleaks-action: action сканирует диапазон от родителя
      # первого отправленного коммита и падает, если это первый коммит репозитория
      - name: gitleaks по всей истории
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
